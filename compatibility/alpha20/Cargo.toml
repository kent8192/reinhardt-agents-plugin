[package]
name = "reinhardt-plugin-alpha20-compatibility"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Event", "HtmlFormElement", "HtmlInputElement"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.reinhardt]
package = "reinhardt-web"
version = "=0.4.0-alpha.20"
default-features = false
features = ["pages", "i18n", "routing", "client-router", "core"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reinhardt = { package = "reinhardt-web", version = "=0.4.0-alpha.20", default-features = false, features = ["pages", "i18n", "di", "core", "conf", "routing", "client-router", "rest", "api", "auth", "sessions", "database", "db-sqlite", "social-auth", "tasks-durable", "signals"] }
hyper = "1"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
mockall = "0.13"
rstest = "0.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[profile.dev]
debug = 0

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(server)'] }
